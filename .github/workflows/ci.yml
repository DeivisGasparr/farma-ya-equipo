
name: CI Backend - FarmaYa

on:
  push:
    branches:
      - main
      - feature/ci-backend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Preparar Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw --batch-mode --no-transfer-progress clean test
