# Configuración del servidor
server.port=8080

# Configuración para MySQL 
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:farmaya}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:farmaya_app}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de inicialización de la base de datos
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:/farmaYa.sql
spring.sql.init.continue-on-error=false

# JWT Configuration
jwt.secret=ZmFybWF5YUFwcDIwMjVTZWN1cmVKV1RLZXlGb3JBdXRoZW50aWNhdGlvblNlcnZpY2VXaXRoSFM1MTJBbGdvcml0aG1BbmRFeHRyYVNlY3VyaXR5TGF5ZXJGb3JQcm9kdWN0aW9uRW52aXJvbm1lbnQ=
jwt.expiration=300000
jwt.refresh-expiration=604800000
jwt.algorithm=HS512
jwt.issuer=farmaya-api
jwt.audience=farmaya-client

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

logging.level.com.farma_ya=DEBUG
logging.level.org.springframework.security=DEBUG
